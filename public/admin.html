<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>고성 AI 뮤직 페스티벌 | 운영진 관리</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="page wide">
    <section class="panel">
      <div class="admin-head">
        <div>
          <div class="badge dark">ADMIN</div>
          <h1>고성 AI 뮤직 페스티벌 운영진</h1>
          <p class="note">다국어 신청 원문과 한국어 자동번역을 함께 확인할 수 있습니다.</p>
        </div>
      </div>
      <div class="toolbar">
        <input id="search" placeholder="이름·이메일·국가·접수번호 검색">
        <select id="statusFilter">
          <option value="">전체 상태</option>
          <option>접수</option><option>가사제작</option><option>음원제작</option>
          <option>에이미온업로드</option><option>전달완료</option><option>취소</option>
        </select>
        <button class="btn" id="refresh">새로고침</button>
        <button class="btn secondary" id="download">CSV 다운로드</button>
      </div>
      <div id="summary" class="event-box">불러오는 중...</div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead><tr>
            <th>접수번호 / 언어</th>
            <th>참가자</th>
            <th>연락처</th>
            <th>제목 · 이야기 원문 / 한국어</th>
            <th>음악 / 번역상태</th>
            <th>공개동의</th>
            <th>상태</th>
            <th>접수일</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/assets/admin.js"></script>
</body>
</html>
